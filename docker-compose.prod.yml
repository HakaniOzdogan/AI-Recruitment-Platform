services:
  db:
    image: postgres:16-alpine
    container_name: ik-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ik-api-prod
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: ${DB_CONNECTION}
      JWT_SECRET: ${JWT_SECRET}
      Jwt__Secret: ${JWT_SECRET}
      CvStorage__RootPath: /app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - cv_storage:/app/storage

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ik-web-prod
    restart: unless-stopped
    environment:
      API_BASE_URL: ${WEB_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ik-migrate
    restart: "no"
    environment:
      ConnectionStrings__Default: ${DB_CONNECTION}
      JWT_SECRET: ${JWT_SECRET}
      Jwt__Secret: ${JWT_SECRET}
      APPLY_MIGRATIONS_ON_STARTUP: "true"
    command: ["dotnet", "IkOtomasyon.Api.dll", "--migrate"]
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: ik-adminer
    restart: unless-stopped
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  pg_data:
  cv_storage:
